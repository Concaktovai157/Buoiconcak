<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Giới thiệu các bạn trong lớp</title>
  <style>
    :root{--accent:#4f46e5;--bg:#0f172a;--card:#1e293b}
    *{box-sizing:border-box;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,"Helvetica Neue",Arial}
    body{margin:0;background:var(--bg);color:#f1f5f9}
    .wrap{max-width:1000px;margin:36px auto;padding:20px}
    header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    h1{font-size:28px;margin:0;color:#fff;text-shadow:0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:18px}

    .list{background:var(--card);padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.4)}
    .search{display:flex;gap:8px;margin-bottom:8px}
    .search input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f1f5f9}
    .btn{display:block;width:100%;text-align:left;padding:10px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:#f1f5f9}
    .btn:hover{background:#334155}
    .btn.active{border-color:var(--accent);box-shadow:inset 0 0 10px rgba(79,70,229,0.6);background:linear-gradient(90deg, rgba(79,70,229,0.2), transparent)}

    .detail{background:var(--card);padding:20px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.4);min-height:260px;display:flex;gap:18px;align-items:center}
    .avatar{width:160px;height:160px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#0f172a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px #0ff}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .info h2{margin:0 0 6px 0;color:#fff;text-shadow:0 0 5px #ff0, 0 0 10px #ff0, 0 0 20px #ff0}
    .info p{margin:6px 0;color:#cbd5e1}
    .meta{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:6px 10px;border-radius:999px;background:#334155;font-size:13px;color:#f1f5f9}

    @media (max-width:800px){
      .layout{grid-template-columns:1fr;}
      .avatar{width:120px;height:120px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>CLASS 8B TRƯỜNG THCS KLOI 2025</h1>
      <small style="color:#94a3b8">(Nhấn vào tên để xem ảnh và thông tin)</small>
    </header>

    <div class="layout">
      <aside class="list">
        <div class="search">
          <input id="search" placeholder="Tìm theo tên..." />
        </div>
        <div id="names"></div>
      </aside>

      <main>
        <section id="profile" class="detail">
          <div style="flex:1">
            <h2 style="color:#94a3b8;text-shadow:none">Chọn một tên bên trái</h2>
            <p>Ảnh và thông tin chi tiết sẽ xuất hiện ở đây.</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const students = [
      {
        id: 'ONE',
        name: 'LE THI VAN ANH',
        avatar: 'https://i.postimg.cc/3xNmNZGP/IMG20250810202103.jpg',
        class: '8B',
        role: 'Lớp trưởng',
        bio: 'Thích làm chó.'
      },
      {
        id: '2',
        name: 'Trần Thị B',
        avatar: 'https://via.placeholder.com/320x320.png?text=Thi+B&bg=transparent',
        class: '12A1',
        role: 'Phó lớp',
        bio: 'Yêu thích mỹ thuật và thiết kế poster.'
      },
      {
        id: '3',
        name: 'Lê Văn C',
        avatar: 'https://via.placeholder.com/320x320.png?text=Van+C&bg=transparent',
        class: '12A1',
        role: 'Thành viên',
        bio: 'Đam mê khoa học máy tính, thích làm robot.'
      }
    ];

    const namesEl = document.getElementById('names');
    const profileEl = document.getElementById('profile');
    const searchInput = document.getElementById('search');

    function renderList(list){
      namesEl.innerHTML = '';
      list.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.type = 'button';
        btn.dataset.id = s.id;
        btn.innerHTML = `<strong>${escapeHtml(s.name)}</strong><div style="font-size:12px;color:#94a3b8">${escapeHtml(s.role)}</div>`;
        btn.addEventListener('click', () => selectStudent(s.id, btn));
        namesEl.appendChild(btn);
      });
    }

    function selectStudent(id, btnEl){
      document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
      btnEl.classList.add('active');
      const s = students.find(x=>x.id===id);
      profileEl.innerHTML = '';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerHTML = `<img src="${s.avatar}" alt="${escapeHtml(s.name)}" />`;

      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = `
        <h2>${escapeHtml(s.name)}</h2>
        <p><strong>Lớp:</strong> ${escapeHtml(s.class)}</p>
        <p><strong>Chức vụ:</strong> ${escapeHtml(s.role)}</p>
        <p>${escapeHtml(s.bio)}</p>
        <div class="meta">
          <div class="chip">ID: ${escapeHtml(s.id)}</div>
          <div class="chip">Thích: ${escapeHtml(randomHobby())}</div>
        </div>
      `;

      profileEl.appendChild(avatar);
      profileEl.appendChild(info);
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m];});
    }

    function randomHobby(){
      const hobbies=['Bóng đá','Vẽ','Lập trình','Âm nhạc','Nấu ăn','Du lịch'];
      return hobbies[Math.floor(Math.random()*hobbies.length)];
    }

    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim().toLowerCase();
      const filtered = students.filter(s=>s.name.toLowerCase().includes(q) || s.role.toLowerCase().includes(q));
      renderList(filtered);
    });

    renderList(students);
  </script>
</body>
</html>
